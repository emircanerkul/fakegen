name: Manual Package Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 1.2.0)'
        required: true
        type: string
      publish:
        description: 'Publish to NPM'
        required: true
        type: boolean
        default: true
      test_coverage:
        description: 'Run extended tests'
        required: false
        type: boolean
        default: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js with NPM Registry
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          registry-url: 'https://registry.npmjs.org'
          scope: '@emircanerkul'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          
      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        
      - name: Run basic functionality test
        run: |
          echo "🧪 Testing FakeGen functionality..."
          npm run start
          
      - name: Validate code generator works
        run: |
          echo "🔍 Validating code generator functionality..."
          ls -la fakegen/
          test -d fakegen/programming-code || (echo "❌ Programming code directory not found" && exit 1)
          test -f fakegen/programming-code/hello_1.js || (echo "❌ JavaScript code file not found" && exit 1)
          test -f fakegen/programming-code/hello_1.py || (echo "❌ Python code file not found" && exit 1)
          test -f fakegen/programming-code/hello_1.java || (echo "❌ Java code file not found" && exit 1)
          echo "✅ Code generator working properly"
          
      - name: Validate generated file structure
        run: |
          echo "📁 Validating directory structure..."
          test -d fakegen/data || (echo "❌ Data directory not found" && exit 1)
          test -d fakegen/images || (echo "❌ Images directory not found" && exit 1)
          test -d fakegen/favicon || (echo "❌ Favicon directory not found" && exit 1)
          test -d fakegen/audio || (echo "❌ Audio directory not found" && exit 1)
          test -d fakegen/video || (echo "❌ Video directory not found" && exit 1)
          echo "✅ Directory structure validation passed"
          
      - name: Check file content is not empty
        run: |
          echo "📝 Validating file content..."
          test -s fakegen/programming-code/hello_1.js || (echo "❌ JavaScript file is empty" && exit 1)
          test -s fakegen/programming-code/hello_1.py || (echo "❌ Python file is empty" && exit 1)
          echo "✅ File content validation passed"
          
      - name: Verify proper file extensions
        run: |
          echo "🔧 Validating file extensions..."
          ls fakegen/programming-code/ | grep -E '\.(js|py|java|go|rs|php|rb|cpp|c|cs|swift|kt|dart)$' > /dev/null || (echo "❌ Expected file extensions not found" && exit 1)
          echo "✅ File extensions validation passed"
          
      - name: Run extended tests
        if: ${{ github.event.inputs.test_coverage == 'true' }}
        run: |
          echo "🧪 Running extended tests..."
          # Check that we have multiple files for each language
          js_count=$(ls fakegen/programming-code/*.js | wc -l)
          py_count=$(ls fakegen/programming-code/*.py | wc -l)
          if [ "$js_count" -lt 5 ]; then
            echo "❌ Expected at least 5 JavaScript files, found $js_count"
            exit 1
          fi
          if [ "$py_count" -lt 5 ]; then
            echo "❌ Expected at least 5 Python files, found $py_count"
            exit 1
          fi
          echo "✅ Extended tests passed"
          
      - name: Clean test artifacts
        run: |
          echo "🧹 Cleaning test artifacts..."
          rm -rf fakegen/
          
      - name: Update package version
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          echo "📦 Updating package version to ${VERSION}"
          npm version "${VERSION}" --no-git-tag-version
          
      - name: Build package for validation
        run: |
          echo "🏗️ Validating package structure..."
          npm pack --dry-run
          
      - name: Debug NPM Configuration
        run: |
          echo "🔍 Debugging NPM configuration..."
          echo "Registry: $(npm config get registry)"
          echo "Auth token present: $(if [ -n "$NODE_AUTH_TOKEN" ]; then echo "Yes (masked)"; else echo "No"; fi)"
          echo "NPM version: $(npm --version)"
          echo "Node version: $(node --version)"
          
          echo "🔗 Testing NPM registry connection..."
          if npm ping > /dev/null 2>&1; then
            echo "✅ NPM registry connection successful"
          else
            echo "❌ NPM registry connection failed"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          
      - name: Validate NPM Authentication
        run: |
          echo "🔐 Validating NPM authentication..."
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "❌ NPM_TOKEN secret is not set"
            exit 1
          fi
          
          echo "🔍 Checking NPM authentication..."
          if ! npm whoami > /dev/null 2>&1; then
            echo "❌ NPM authentication failed"
            echo "Please verify NPM_TOKEN secret is valid"
            exit 1
          fi
          
          echo "✅ NPM authentication verified"
          echo "📝 Authenticated as: $(npm whoami)"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          
      - name: Dry Run NPM Publish
        run: |
          echo "🧪 Testing NPM publish (dry run)..."
          npm publish --dry-run --access public
          echo "✅ Dry run completed successfully"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          
      - name: Conditional NPM Publish
        if: ${{ github.event.inputs.publish == 'true' }}
        run: |
          echo "🚀 Publishing package to NPM registry..."
          
          # Check if package already exists at this version
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          
          if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" > /dev/null 2>&1; then
            echo "⚠️ Version ${PACKAGE_VERSION} already exists"
            echo "Skipping publish to prevent conflicts"
            exit 0
          fi
          
          # Perform the publish
          npm publish --access public
          
          # Verify publication
          sleep 5
          if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" > /dev/null 2>&1; then
            echo "✅ Package ${PACKAGE_NAME}@${PACKAGE_VERSION} published successfully"
          else
            echo "❌ Publication verification failed"
            exit 1
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          
      - name: Verify NPM Package Publication
        if: ${{ github.event.inputs.publish == 'true' }}
        run: |
          echo "🔍 Verifying published package..."
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          
          # Wait for NPM propagation
          echo "⏳ Waiting for package propagation..."
          sleep 10
          
          # Verify package exists and get details
          if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" > /dev/null 2>&1; then
            echo "✅ Package ${PACKAGE_NAME}@${PACKAGE_VERSION} is available on NPM"
            echo "📦 Package details:"
            npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" --json | jq -r '.name, .version, .description'
          else
            echo "❌ Package verification failed - not found on NPM registry"
            echo "🔍 Checking if package exists with different version..."
            npm view "${PACKAGE_NAME}" versions --json || echo "Package not found in registry"
            exit 1
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Create Git tag
        if: ${{ github.event.inputs.publish == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.event.inputs.version }}
        run: |
          echo "🏷️ Creating Git tag..."
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add package.json package-lock.json
          git commit -m "chore: bump version to v${VERSION}"
          git tag "v${VERSION}"
          git push origin "v${VERSION}"
          git push origin HEAD:master
          
      - name: Build npm package tarball
        if: ${{ github.event.inputs.publish == 'true' }}
        run: |
          echo "📦 Building npm package tarball to attach to the GitHub release..."
          npm pack
          ls -lh *.tgz
          
      - name: Notify on Failure
        if: failure()
        run: |
          echo "❌ Workflow failed - Troubleshooting information:"
          echo "📋 Common issues and solutions:"
          echo "1. NPM_TOKEN secret not configured or expired"
          echo "2. Package name conflicts or version already exists"
          echo "3. Network connectivity issues with NPM registry"
          echo "4. Insufficient permissions for package publishing"
          echo ""
          echo "🔧 Debug checklist:"
          echo "- Verify NPM_TOKEN secret is set in repository settings"
          echo "- Ensure token has publish permissions for the package"
          echo "- Check if package version already exists on NPM"
          echo "- Verify package.json configuration is correct"
          
      - name: Create GitHub release with package attached
        if: ${{ github.event.inputs.publish == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: Release v${{ github.event.inputs.version }}
          body: |
            ## Changes in v${{ github.event.inputs.version }}
            
            ### 🐛 Bug Fixes
            - Fixed NPM token configuration for GitHub Actions publishing
            - Enhanced authentication validation and error handling
            - Improved workflow debugging and troubleshooting capabilities
            
            ### 🚀 Features
            - Automated GitHub Actions release workflow
            - Comprehensive NPM authentication validation
            - Pre-publish dry-run testing
            - Post-deployment verification
            - Enhanced error handling and debugging
            
            ### 📦 Installation
            ```bash
            npm install -g @emircanerkul/fakegen@${{ github.event.inputs.version }}
            ```
            
            Or download the package tarball (`.tgz`) attached to this release — release assets are kept permanently, unlike workflow artifacts which expire.
            
            ### 🧪 Testing
            The package has been tested with:
            - ✅ NPM authentication validation
            - ✅ Pre-publish dry-run testing
            - ✅ Publication verification
            - ✅ Comprehensive error handling
            
            Generated using automated release workflow.
          files: |
            *.tgz
          draft: false
          prerelease: false
          
      - name: Summary
        env:
          VERSION: ${{ github.event.inputs.version }}
          PUBLISH: ${{ github.event.inputs.publish }}
          TEST_COVERAGE: ${{ github.event.inputs.test_coverage }}
        run: |
          echo "## 🎉 Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: v${VERSION}" >> $GITHUB_STEP_SUMMARY
          echo "- **Published to NPM**: ${PUBLISH}" >> $GITHUB_STEP_SUMMARY
          echo "- **Extended Tests**: ${TEST_COVERAGE}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ✅ Success" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Release Assets" >> $GITHUB_STEP_SUMMARY
          echo "- The npm package tarball (\`.tgz\`) is attached to the GitHub release and never expires." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🧪 Test Results" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Code generator functionality verified" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ File structure validation passed" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Content validation passed" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ File extensions validation passed" >> $GITHUB_STEP_SUMMARY
          if [ "${TEST_COVERAGE}" == "true" ]; then
            echo "- ✅ Extended tests passed" >> $GITHUB_STEP_SUMMARY
          fi
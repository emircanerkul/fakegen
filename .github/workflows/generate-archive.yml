name: Generate FakeGen Archive

on:
  workflow_dispatch:
    inputs:
      archive_name:
        description: 'Custom archive name (without extension)'
        required: false
        type: string
        default: 'fakegen-samples'
      include_metadata:
        description: 'Include generation metadata and statistics'
        required: false
        type: boolean
        default: true
      compression_level:
        description: 'Archive compression level (1-9, 9=max)'
        required: false
        type: choice
        options:
          - '6'
          - '1'
          - '3'
          - '9'
        default: '6'
      archive_format:
        description: 'Archive format'
        required: false
        type: choice
        options:
          - 'zip'
          - 'tar.gz'
          - 'both'
        default: 'zip'
  schedule:
    # Run daily at 2 AM UTC to create fresh samples
    - cron: '0 2 * * *'
  push:
    branches: [ master ]
    paths:
      - 'src/**'
      - 'bin/**'
      - 'package.json'

jobs:
  generate-archive:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Generate timestamp and archive name
        id: metadata
        env:
          ARCHIVE_INPUT: ${{ github.event.inputs.archive_name }}
        run: |
          TIMESTAMP=$(date -u +"%Y%m%d-%H%M%S")
          if [ "${ARCHIVE_INPUT}" != "" ]; then
            ARCHIVE_NAME="${ARCHIVE_INPUT}-${TIMESTAMP}"
          else
            ARCHIVE_NAME="fakegen-samples-${TIMESTAMP}"
          fi
          echo "timestamp=${TIMESTAMP}" >> $GITHUB_OUTPUT
          echo "archive_name=${ARCHIVE_NAME}" >> $GITHUB_OUTPUT
          echo "Generated archive name: ${ARCHIVE_NAME}"
          
      - name: Run FakeGen to generate content
        run: |
          echo "🚀 Generating FakeGen content..."
          npm run start
          
      - name: Verify generation completed
        run: |
          echo "🔍 Verifying generated content..."
          if [ ! -d "fakegen" ]; then
            echo "❌ FakeGen directory not found!"
            exit 1
          fi
          
          # Check key directories exist
          for dir in data images favicon programming-code audio video; do
            if [ ! -d "fakegen/$dir" ]; then
              echo "⚠️  Warning: $dir directory not found"
            else
              echo "✅ $dir directory exists"
            fi
          done
          
      - name: Generate content statistics
        id: stats
        run: |
          echo "📊 Generating content statistics..."
          
          # Count files by type
          TOTAL_FILES=$(find fakegen -type f | wc -l)
          PROGRAMMING_FILES=$(find fakegen/programming-code -type f 2>/dev/null | wc -l || echo "0")
          DATA_FILES=$(find fakegen/data -type f 2>/dev/null | wc -l || echo "0")
          IMAGE_FILES=$(find fakegen/images -type f 2>/dev/null | wc -l || echo "0")
          FAVICON_FILES=$(find fakegen/favicon -type f 2>/dev/null | wc -l || echo "0")
          AUDIO_FILES=$(find fakegen/audio -type f 2>/dev/null | wc -l || echo "0")
          VIDEO_FILES=$(find fakegen/video -type f 2>/dev/null | wc -l || echo "0")
          
          # Calculate directory sizes
          TOTAL_SIZE=$(du -sh fakegen | cut -f1)
          
          echo "total_files=${TOTAL_FILES}" >> $GITHUB_OUTPUT
          echo "programming_files=${PROGRAMMING_FILES}" >> $GITHUB_OUTPUT
          echo "data_files=${DATA_FILES}" >> $GITHUB_OUTPUT
          echo "image_files=${IMAGE_FILES}" >> $GITHUB_OUTPUT
          echo "favicon_files=${FAVICON_FILES}" >> $GITHUB_OUTPUT
          echo "audio_files=${AUDIO_FILES}" >> $GITHUB_OUTPUT
          echo "video_files=${VIDEO_FILES}" >> $GITHUB_OUTPUT
          echo "total_size=${TOTAL_SIZE}" >> $GITHUB_OUTPUT
          
          echo "📊 Content Statistics:"
          echo "  - Total files: ${TOTAL_FILES}"
          echo "  - Programming code files: ${PROGRAMMING_FILES}"
          echo "  - Data files: ${DATA_FILES}"
          echo "  - Image files: ${IMAGE_FILES}"
          echo "  - Favicon files: ${FAVICON_FILES}"
          echo "  - Audio files: ${AUDIO_FILES}"
          echo "  - Video files: ${VIDEO_FILES}"
          echo "  - Total size: ${TOTAL_SIZE}"
          
      - name: Create generation metadata
        if: ${{ github.event.inputs.include_metadata != 'false' }}
        run: |
          echo "📝 Creating generation metadata..."
          
          cat > fakegen/GENERATION_INFO.md << EOF
          # FakeGen Content Archive
          
          ## Generation Information
          - **Generated on**: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          - **FakeGen Version**: $(node -p "require('./package.json').version")
          - **Node.js Version**: $(node --version)
          - **Platform**: $(uname -s) $(uname -r)
          - **Architecture**: $(uname -m)
          - **Workflow Run**: ${{ github.run_number }}
          - **Commit SHA**: ${{ github.sha }}
          
          ## Content Statistics
          - **Total Files**: ${{ steps.stats.outputs.total_files }}
          - **Programming Code Files**: ${{ steps.stats.outputs.programming_files }}
          - **Data Files**: ${{ steps.stats.outputs.data_files }}
          - **Image Files**: ${{ steps.stats.outputs.image_files }}
          - **Favicon Files**: ${{ steps.stats.outputs.favicon_files }}
          - **Audio Files**: ${{ steps.stats.outputs.audio_files }}
          - **Video Files**: ${{ steps.stats.outputs.video_files }}
          - **Total Size**: ${{ steps.stats.outputs.total_size }}
          
          ## Directory Structure
          \`\`\`
          $(tree fakegen -L 3 2>/dev/null || find fakegen -type d | head -20 | sort)
          \`\`\`
          
          ## Sample Files
          
          ### Programming Languages Generated
          \`\`\`
          $(ls fakegen/programming-code/ 2>/dev/null | grep -o '\.[^.]*$' | sort | uniq -c | sort -nr | head -10 || echo "No programming files found")
          \`\`\`
          
          ### Data Formats Generated
          \`\`\`
          $(find fakegen/data -name "*.json" -o -name "*.csv" -o -name "*.xml" -o -name "*.yml" -o -name "*.toml" -o -name "*.txt" 2>/dev/null | grep -o '\.[^.]*$' | sort | uniq -c | sort -nr || echo "No data files found")
          \`\`\`
          
          ### Image Formats and Sizes
          \`\`\`
          $(find fakegen/images -name "*.jpg" -o -name "*.png" -o -name "*.webp" -o -name "*.svg" 2>/dev/null | grep -o '\.[^.]*$' | sort | uniq -c | sort -nr || echo "No image files found")
          \`\`\`
          
          ## Usage
          This archive contains sample output from FakeGen CLI tool.
          
          - **Data files**: Located in \`data/\` directory, organized by data type and format
          - **Images**: Located in \`images/\` directory, organized by aspect ratio
          - **Favicons**: Located in \`favicon/\` directory, multiple sizes and formats
          - **Programming codes**: Located in \`programming-code/\` directory
          - **Audio files**: Located in \`audio/\` directory, various formats and styles
          - **Video files**: Located in \`video/\` directory, various formats
          
          ## About FakeGen
          FakeGen is a comprehensive CLI tool for generating fake data, images, code examples, and media files for testing, prototyping, and development purposes.
          
          Repository: https://github.com/emircanerkul/fakegen
          EOF
          
      - name: Create file listing
        run: |
          echo "📄 Creating comprehensive file listing..."
          
          cat > fakegen/FILE_LISTING.txt << EOF
          FakeGen Archive File Listing
          Generated: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          
          $(find fakegen -type f -not -name "FILE_LISTING.txt" -not -name "GENERATION_INFO.md" | sort)
          EOF
          
      - name: Create sample showcase
        run: |
          echo "🎨 Creating sample showcase..."
          mkdir -p fakegen/samples
          
          # Copy a few sample files for quick preview
          if [ -f "fakegen/programming-code/hello_1.js" ]; then
            cp "fakegen/programming-code/hello_1.js" "fakegen/samples/sample.js"
          fi
          
          if [ -f "fakegen/programming-code/hello_1.py" ]; then
            cp "fakegen/programming-code/hello_1.py" "fakegen/samples/sample.py"
          fi
          
          if [ -f "fakegen/data/user-profiles/json/user-profiles.json" ]; then
            head -20 "fakegen/data/user-profiles/json/user-profiles.json" > "fakegen/samples/user-profiles-preview.json"
          fi
          
          # Create a quick README for samples
          cat > fakegen/samples/README.md << EOF
          # Sample Files
          
          This directory contains a few sample files for quick preview:
          
          $(ls -la fakegen/samples/ | grep -v "^total" | grep -v "README.md")
          
          For complete content, explore the main directories.
          EOF
          
      - name: Create ZIP archive
        if: ${{ github.event.inputs.archive_format == 'zip' || github.event.inputs.archive_format == 'both' || github.event.inputs.archive_format == '' }}
        env:
          COMPRESSION_LEVEL: ${{ github.event.inputs.compression_level || '6' }}
        run: |
          echo "📦 Creating ZIP archive..."
          # Validate compression level (choice input, but never trust raw input in shell)
          case "${COMPRESSION_LEVEL}" in
            [1-9]) ;;
            *) echo "❌ Invalid compression level: ${COMPRESSION_LEVEL}"; exit 1 ;;
          esac
          zip -r -"${COMPRESSION_LEVEL}" "${{ steps.metadata.outputs.archive_name }}.zip" fakegen/
          
          # Get archive info
          ZIP_SIZE=$(du -sh "${{ steps.metadata.outputs.archive_name }}.zip" | cut -f1)
          echo "✅ ZIP archive created: ${{ steps.metadata.outputs.archive_name }}.zip (${ZIP_SIZE})"
          
      - name: Create TAR.GZ archive
        if: ${{ github.event.inputs.archive_format == 'tar.gz' || github.event.inputs.archive_format == 'both' }}
        run: |
          echo "📦 Creating TAR.GZ archive..."
          tar -czf "${{ steps.metadata.outputs.archive_name }}.tar.gz" fakegen/
          
          # Get archive info
          TAR_SIZE=$(du -sh "${{ steps.metadata.outputs.archive_name }}.tar.gz" | cut -f1)
          echo "✅ TAR.GZ archive created: ${{ steps.metadata.outputs.archive_name }}.tar.gz (${TAR_SIZE})"
          
      - name: Verify archives
        run: |
          echo "🔍 Verifying created archives..."
          
          if [ -f "${{ steps.metadata.outputs.archive_name }}.zip" ]; then
            echo "📦 ZIP Archive:"
            ls -lh "${{ steps.metadata.outputs.archive_name }}.zip"
            echo "   Contents: $(unzip -l "${{ steps.metadata.outputs.archive_name }}.zip" | tail -1)"
          fi
          
          if [ -f "${{ steps.metadata.outputs.archive_name }}.tar.gz" ]; then
            echo "📦 TAR.GZ Archive:"
            ls -lh "${{ steps.metadata.outputs.archive_name }}.tar.gz"
            echo "   Contents: $(tar -tzf "${{ steps.metadata.outputs.archive_name }}.tar.gz" | wc -l) files"
          fi
          
      - name: Determine release flags
        id: flags
        run: |
          # Scheduled (nightly) runs are published as prereleases to reduce noise
          if [ "${{ github.event_name }}" == "schedule" ]; then
            echo "prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub release with archives attached
        uses: softprops/action-gh-release@v2
        with:
          tag_name: archive-${{ steps.metadata.outputs.timestamp }}
          name: FakeGen Archive ${{ steps.metadata.outputs.timestamp }}
          body: |
            # FakeGen Sample Archive ${{ steps.metadata.outputs.timestamp }}
            
            This release contains a complete sample archive generated by FakeGen.
            
            ## 📊 Content Statistics
            - **Total Files**: ${{ steps.stats.outputs.total_files }}
            - **Programming Code Files**: ${{ steps.stats.outputs.programming_files }}
            - **Data Files**: ${{ steps.stats.outputs.data_files }}
            - **Image Files**: ${{ steps.stats.outputs.image_files }}
            - **Favicon Files**: ${{ steps.stats.outputs.favicon_files }}
            - **Audio Files**: ${{ steps.stats.outputs.audio_files }}
            - **Video Files**: ${{ steps.stats.outputs.video_files }}
            - **Total Size**: ${{ steps.stats.outputs.total_size }}
            
            ## 📦 Downloads
            - ZIP and TAR.GZ archives are attached to this release
            - Release assets are kept permanently (they do NOT expire like workflow artifacts)
            
            ## 🚀 Generated Content
            - **Data**: Multiple formats (JSON, CSV, XML, YAML, TOML, TXT)
            - **Images**: Various aspect ratios and sizes (JPG, PNG, WebP, SVG)
            - **Favicons**: Multiple sizes and formats
            - **Programming Code**: 18+ programming languages
            - **Audio**: Multiple formats and musical styles
            - **Video**: Various formats and animations
            
            Generated automatically by FakeGen v$(node -p "require('./package.json').version")
          files: |
            ${{ steps.metadata.outputs.archive_name }}.zip
            ${{ steps.metadata.outputs.archive_name }}.tar.gz
          fail_on_unmatched_files: false
          draft: false
          prerelease: ${{ steps.flags.outputs.prerelease == 'true' }}
          
      - name: Summary
        env:
          ARCHIVE_FORMAT: ${{ github.event.inputs.archive_format || 'zip' }}
          COMPRESSION_LEVEL: ${{ github.event.inputs.compression_level || '6' }}
          INCLUDE_METADATA: ${{ github.event.inputs.include_metadata }}
        run: |
          echo "## 🎉 Archive Generation Complete!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Generated Archives" >> $GITHUB_STEP_SUMMARY
          echo "- **Archive Name**: ${{ steps.metadata.outputs.archive_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Format**: ${ARCHIVE_FORMAT}" >> $GITHUB_STEP_SUMMARY
          echo "- **Compression Level**: ${COMPRESSION_LEVEL}" >> $GITHUB_STEP_SUMMARY
          echo "- **Include Metadata**: ${INCLUDE_METADATA}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📊 Content Statistics" >> $GITHUB_STEP_SUMMARY
          echo "- **Total Files**: ${{ steps.stats.outputs.total_files }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Programming Files**: ${{ steps.stats.outputs.programming_files }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Data Files**: ${{ steps.stats.outputs.data_files }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Image Files**: ${{ steps.stats.outputs.image_files }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Favicon Files**: ${{ steps.stats.outputs.favicon_files }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Audio Files**: ${{ steps.stats.outputs.audio_files }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Video Files**: ${{ steps.stats.outputs.video_files }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Total Size**: ${{ steps.stats.outputs.total_size }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 💾 Download Links" >> $GITHUB_STEP_SUMMARY
          echo "Archives are attached to the GitHub release **archive-${{ steps.metadata.outputs.timestamp }}**." >> $GITHUB_STEP_SUMMARY
          echo "Release assets are kept permanently — they do not expire like workflow artifacts." >> $GITHUB_STEP_SUMMARY